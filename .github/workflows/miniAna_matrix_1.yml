name: miniAna

on:
  push:
    branches: [dev_tkar]

jobs:
  job_multiOS:
    strategy:
      fail-fast: true # applies to the entire matrix
      matrix:
        os: [ubuntu-latest, macos-latest]
        experimental: [false] # must pass (e.g. expected to be stable)
        include:
          os: windows-latest
          experimental: true # experimental and hence allowed to fail
    
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    container:
      image: python:3.14-slim
    steps:
      - name: checkout-repo
        uses: actions/checkout@v4
      #
      # - name: setup-python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"

      - name: test-python-version
        run: python3 --version

      - name: install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest
          pip install numpy matplotlib pandas

      - name: run-tests
        run: pytest -v
