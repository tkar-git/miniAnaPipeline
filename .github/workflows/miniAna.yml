name: miniAna

on:
  push:
    branches: [dev_tkar]

jobs:
  job_macos:
    runs-on: macos-latest
    steps:
      - name: checkout-repo
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5

      - name: test-python-version
        run: python3 --version
  
  job_ubuntu:
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
    steps:
      - name: checkout-repo
        uses: actions/checkout@v6

      - name: test-python-version
        run: python3 --version
